<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown to 3 PM</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffd1e3;--b2:#e1d4ff;--b3:#cfeaff;--b4:#d8f5df;--ink:#111;--red:#e63030;--gold:#ffd23f;--g:12vh;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#0b0b14;--b2:#15122b;--b3:#1c1840;--b4:#241d52}}
:root[data-theme="dark"]{--b1:#0b0b14;--b2:#15122b;--b3:#1c1840;--b4:#241d52}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--b1) 0 25%,var(--b2) 25% 50%,var(--b3) 50% 75%,var(--b4) 75%);font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;overflow:hidden;color:var(--ink)}
.out{color:#fff;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:.07em .1em 0 var(--ink)}
.cloud{position:fixed;left:-300px;width:160px;height:48px;background:#fff;clip-path:polygon(0 100%,0 60%,15% 60%,15% 30%,35% 30%,35% 0,65% 0,65% 30%,85% 30%,85% 60%,100% 60%,100% 100%);animation:drift linear infinite}
@keyframes drift{to{transform:translateX(calc(100vw + 600px))}}
.hill{position:fixed;bottom:var(--g);clip-path:polygon(0 100%,0 70%,10% 70%,10% 45%,25% 45%,25% 20%,45% 20%,45% 45%,60% 45%,60% 70%,80% 70%,80% 85%,100% 85%,100% 100%)}
.ground{position:fixed;left:0;right:0;bottom:0;height:calc(var(--g) + env(safe-area-inset-bottom,0px));background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/64px 64px;border-top:8px solid var(--red)}
#layout{position:fixed;inset:0;display:grid;grid-template-columns:3fr 1fr;grid-template-areas:"c a";align-items:center;gap:2vw;padding:0 2.5vw calc(var(--g) + 110px);z-index:3}
#center{grid-area:c;text-align:center;min-width:0}
.win{background:#fff;border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);color:var(--ink)}
#qa{grid-area:a;justify-self:center;width:min(26vw,44vh);padding:12px;text-align:center}
#qa img{width:100%;height:auto;display:block}
#qa h3{margin:0 0 8px;font-size:min(2vw,3.6vh);line-height:1.1}
#qa small{display:block;font-size:min(1.4vw,2.6vh);margin-top:6px;color:var(--red)}
#title h1{margin:0;font-weight:700;font-size:min(8vw,17vh);line-height:1;display:flex;justify-content:center}
#title h1 span{display:inline-block;animation:drop .9s steps(8) both,bob 1.6s steps(4) infinite;animation-delay:calc(var(--i)*.09s),calc(1s + var(--i)*.12s)}
#title.go h1 span{animation:fly .7s steps(8) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes drop{0%{transform:translateY(-120vh)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-8%)}}
@keyframes fly{to{transform:translateY(-110vh);opacity:0}}
#ttl2{font-size:min(3.4vw,7vh);margin:14px 0 min(4vh,30px)}
#start{font:inherit;font-size:min(2.6vw,5.2vh);padding:.4em 1.2em;background:#fff;color:var(--red);border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);cursor:pointer;animation:pulse 1s steps(2) infinite}
#start:active{transform:translate(6px,6px);box-shadow:2px 2px 0 var(--ink)}
@keyframes pulse{50%{transform:translateY(-6px)}}
#hint{font-size:min(1.6vw,3vh);margin-top:22px}
#run{display:none}
#run.show{display:block;animation:slam .9s steps(9)}
#blockwrap{position:relative;height:64px;margin-bottom:10px}
#block{width:56px;height:56px;margin:0 auto;background:var(--gold);border:6px solid var(--ink);display:grid;place-items:center;font-size:30px;color:var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.2)}
.bump{animation:bump .35s steps(4)}
@keyframes bump{40%{transform:translateY(-16px)}100%{transform:none}}
.popcoin{position:absolute;left:50%;top:0;width:20px;height:28px;margin-left:-10px;background:var(--gold);border:4px solid var(--ink);animation:coinpop .9s steps(12) forwards}
@keyframes coinpop{0%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-40px) scaleX(.2)}50%{transform:translateY(-80px) scaleX(1)}75%{transform:translateY(-55px) scaleX(.2)}100%{transform:translateY(-30px) scaleX(1);opacity:0}}
#banner{display:none;font-size:min(8vw,12vh);color:var(--gold)}
#banner.show{display:block;animation:slam .9s steps(9)}
#clockwin{display:inline-block;padding:min(2vh,16px) min(3vw,40px) min(2vh,14px)}
#clock{display:flex;align-items:flex-end;justify-content:center;font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;font-size:min(9vw,20vh);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.015em;line-height:1.05;transform-origin:50% 100%;color:var(--ink)}
#clock b,#clock s{display:inline-block;font-weight:700;text-decoration:none;transform-origin:50% 100%}
#clock b{min-width:.62em}
#clock s{padding:0 .04em;color:var(--red);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
#clock span{display:inline-block;transform-origin:50% 100%}
.land{animation:land .5s steps(5)}
@keyframes land{0%{transform:translateY(-45%);opacity:0}60%{transform:scale(1.18,.8);opacity:1}100%{transform:none}}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-26%)}65%{transform:scale(1.12,.86)}}
@keyframes spin{50%{transform:scaleX(.05)}}
@keyframes slam{0%{transform:scale(3);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:none}}
@keyframes squash{40%{transform:scale(1.15,.7)}70%{transform:scale(.95,1.08)}}
@keyframes spooky{25%{opacity:.2;transform:translateY(10px) skewX(-8deg)}55%{transform:scaleY(-1);opacity:.5}80%{opacity:.3;transform:skewX(6deg)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}15%,85%{transform:scale(1.12)}100%{filter:hue-rotate(1080deg)}}
.spin360{animation:spin .8s steps(8)}.squash{animation:squash .35s steps(4)}.spooky{animation:spooky 1.6s steps(16)}.rainbow{animation:rainbow 2.4s steps(24)}
.shake{animation:shake .45s steps(4)}
.glow{animation:glow .9s steps(8)}
@keyframes glow{0%,100%{filter:none}35%{filter:drop-shadow(0 0 12px var(--gold))}65%{filter:drop-shadow(0 0 22px var(--red))}}
@keyframes shake{25%{transform:translate(-8px,4px)}50%{transform:translate(8px,-4px)}75%{transform:translate(-4px,2px)}}
#sub{font-size:min(2.6vw,5vh);margin-top:6px}
#msg{font-size:min(1.8vw,3.4vh);margin-top:2px;color:var(--red)}
.star{position:fixed;left:50%;top:45%;width:12px;height:12px;border:3px solid var(--ink);animation:fly2 1.1s steps(14) forwards;pointer-events:none;z-index:8}
@keyframes fly2{to{transform:translate(var(--x),var(--y));opacity:0}}
.rain{position:fixed;top:-40px;width:20px;height:28px;background:var(--gold);border:4px solid var(--ink);animation:fall 1.8s steps(24) forwards;pointer-events:none;z-index:8}
@keyframes fall{to{transform:translateY(115vh)}}
.char{position:fixed;z-index:7;pointer-events:none}
.char svg,.char img{width:100%;height:auto;display:block}
.char img{border:6px solid var(--ink);aspect-ratio:1;object-fit:cover;image-rendering:pixelated}
#course{display:none;position:fixed;left:9vw;right:9vw;bottom:calc(var(--g) + env(safe-area-inset-bottom,0px) + 8px);height:0;z-index:5}
#course.show{display:block}
#runner{position:absolute;left:0;width:40px;margin-left:-20px;bottom:0;transition:left 1s linear;animation:run .5s steps(2) infinite}
@keyframes run{0%,100%{margin-bottom:0}50%{margin-bottom:14px}}
#flag{position:absolute;right:-6px;bottom:0;width:6px;height:84px;background:var(--ink)}
#flag::after{content:"";position:absolute;left:6px;top:0;width:30px;height:22px;background:var(--red);border:4px solid var(--ink);animation:wave 1s steps(2) infinite}
@keyframes wave{50%{transform:translateY(4px)}}
#tools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:9;display:flex;gap:8px;opacity:.3;transition:opacity .2s}
#tools:hover,#tools:focus-within{opacity:1}
#tools button{font:inherit;font-size:.9rem;padding:6px 12px;border:4px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
:focus-visible{outline:4px solid var(--red);outline-offset:3px}
@media (max-aspect-ratio:1/1){
#layout{grid-template-columns:1fr;grid-template-rows:1fr auto;grid-template-areas:"c" "a";padding-bottom:calc(var(--g) + 60px)}
#qa{width:min(52vw,26vh)}#qa h3{font-size:3.4vw}#qa small{font-size:2.6vw}
#clock{font-size:min(15vw,90px)}#title h1{font-size:11vw}#ttl2{font-size:6vw}#start{font-size:6vw}#sub{font-size:5vw}#msg{font-size:3.6vw}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="cloud" style="top:10%;animation-duration:60s"></div>
<div class="cloud" style="top:24%;animation-duration:90s;animation-delay:-40s;transform:scale(.7)"></div>

<div class="hill" style="right:-4vw;width:60vw;height:18vh;background:#ffb6d0"></div>
<div class="ground"></div>
<div id="tools"><button id="fs">Fullscreen</button></div>
<div id="layout">
<section id="center">
<div id="title"><h1 class="out" id="h1" aria-label="Countdown"></h1><div id="ttl2" class="out">to 3:00 PM</div><button id="start">&gt; Start countdown &lt;</button><div id="hint" class="out">or press Enter</div></div>

</div>
</div>

"COUNTDOWN".split("").forEach(function(c,i){var s=document.createElement("span");s.textContent=c;s.style.setProperty("--i",i);s.style.color=cols[i%5];$("h1").appendChild(s)});
function play(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function wave(){parts.forEach(function(p,i){p.style.animation="none";void p.offsetWidth;p.style.animation="hop .6s steps(6) "+(i*.06)+"s"})}
function coin(){var c=document.createElement("i");c.className="popcoin";wrap.appendChild(c);play(block,"bump");setTimeout(function(){c.remove()},900)}
function stars(n){for(var i=0;i<n;i++){var s=document.createElement("i");s.className="star";var a=Math.random()*6.283,d=100+Math.random()*190;
  s.style.setProperty("--x",Math.round(Math.cos(a)*d/12)*12+"px");s.style.setProperty("--y",Math.round(Math.sin(a)*d/12)*12+"px");s.style.background=cols[i%5];
  document.body.appendChild(s);setTimeout(function(e){e.remove()}.bind(null,s),1100)}}
function rain(n){for(var i=0;i<n;i++)(function(i){setTimeout(function(){var c=document.createElement("i");c.className="rain";c.style.left=Math.random()*96+"vw";document.body.appendChild(c);setTimeout(function(){c.remove()},1900)},i*45)})(i)}
var PAL={K:"#111",Y:"#ffe38f",P:"#ff8fb8",W:"#fff",D:"#3b3b58",R:"#e63030"};
function spr(rows){var h=rows.length,w=rows[0].length,s='<svg viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges">';
  rows.forEach(function(r,y){for(var x=0;x<w;x++){var c=PAL[r[x]];if(c)s+='<rect x="'+x+'" y="'+y+'" width="1.03" height="1.03" fill="'+c+'"/>'}});return s+"</svg>"}
var ART={
blob:spr(["..KKKKKK..",".KYYYYYYK.","KYYYYYYYYK","KYYKYYKYYK","KYYKYYKYYK","KYYYYYYYYK","KYYKKKKYYK",".KYYYYYYK.",".KPPK.KPPK"]),
bomb:spr([".......R.R","......RYR.",".....K.R..","..KKKKKK..",".KDDDDDDK.","KDDWWDWWDK","KDDWKDWKDK","KDDDDDDDDK",".KDDDDDDK.","..KKKKKK.."]),

spiky:spr(["K...KK...K",".K.KRRK.K.","..KRRRRK..","KKRRRRRRKK","KRWWRRWWRK","KRWKRRWKRK","KKRRRRRRKK","..KRRRRK..",".K.KRRK.K.","K...KK...K"])};
$("runner").innerHTML=ART.blob;
function mk(t,sz){var c=document.createElement("div");c.className="char";c.style.width=sz+"px";c.innerHTML=t==="face"?'<img alt="" src="'+FACE+'">':ART[t];document.body.appendChild(c);return c}
function scatter(){parts.forEach(function(p){p.style.transition="transform .3s steps(6)";p.style.transform="translate("+rnd(-300,300)+"px,"+rnd(-220,220)+"px) rotate("+Math.round(rnd(-6,6))*90+"deg)"});
  setTimeout(function(){parts.forEach(function(p){p.style.transition="transform .7s steps(8)";p.style.transform=""})},900);
  setTimeout(function(){parts.forEach(function(p){p.style.transition=""})},1700)}
var EZ="steps(48)";
function spawn(t){
  if(busy||!started)return;
  var types=["blob","bomb","ghost","spiky"];if(FACE)types.push("face");
  t=t||types[Math.floor(Math.random()*types.length)];
  var r=document.getElementById("clockwin").getBoundingClientRect(),sz=Math.round(Math.min(innerHeight*.17,140)),cx=r.left+r.width/2,c=mk(t,t==="face"?sz*1.3:sz),end=2800;busy=true;
  stars(8);
  if(t==="blob"){c.style.left=cx-sz/2+"px";c.style.top=Math.max(8,r.top-sz*.9)+"px";
    c.animate([{transform:"translateY(-300px)",opacity:0},{transform:"translateY(0) scale(1.2,.8)",opacity:1,offset:.25},{transform:"translateY(-60px)",offset:.4},{transform:"translateY(0) scale(1.2,.8)",offset:.55},{transform:"translateY(-60px)",offset:.7},{transform:"translateY(0) scale(1.2,.8)",offset:.85},{transform:"translateY(-300px)",opacity:0}],{duration:2600,easing:EZ});
    [650,1430,2200].forEach(function(d){setTimeout(function(){play(clock,"squash");stars(4)},d)});end=2700}
  if(t==="bomb"){c.style.left=(Math.random()<.5?r.left-sz*.5:r.right-sz*.5)+"px";c.style.top=Math.max(8,r.top-sz*.4)+"px";
    c.animate([{transform:"scale(0)"},{transform:"scale(1)",offset:.15},{transform:"scale(1.2)",offset:.3},{transform:"scale(1)",offset:.45},{transform:"scale(1.3)",offset:.6},{transform:"scale(1)",offset:.72},{transform:"scale(1.5)",offset:.95},{transform:"scale(0)"}],{duration:2000,easing:EZ});
    setTimeout(function(){c.remove();scatter();stars(36);play(main,"shake")},2000);end=2000}
  if(t==="ghost"){c.style.left="0";c.style.top=Math.max(8,r.top)+"px";var x0=r.left-sz-30,w=r.right+30-x0;
    c.animate([0,.25,.5,.75,1].map(function(f,i){return{transform:"translate("+(x0+w*f)+"px,"+[0,-30,0,30,0][i]+"px)",opacity:.92}}),{duration:3600,easing:EZ});
    setTimeout(function(){play(clock,"spooky")},1000);end=3600}
  if(t==="spiky"){c.style.left="0";c.style.top=r.bottom-sz*.75+"px";
    c.animate([{transform:"translateX("+(r.left-sz)+"px) rotate(0)"},{transform:"translateX("+(r.right+sz)+"px) rotate(1080deg)"}],{duration:2600,easing:"steps(40)"});
    [700,1300,1900].forEach(function(d){setTimeout(function(){wave();stars(5)},d)});end=2600}
  if(t==="face"){c.style.left=Math.max(8,r.left-sz*.2)+"px";c.style.top=Math.max(8,r.top-sz*1.5)+"px";
    c.animate([{transform:"scale(0)"},{transform:"scale(1) rotate(10deg)",offset:.15},{transform:"rotate(-10deg)",offset:.35},{transform:"rotate(10deg)",offset:.55},{transform:"rotate(-10deg)",offset:.75},{transform:"scale(0)"}],{duration:2600,easing:EZ});
    setTimeout(function(){play(clock,"rainbow")},300);end=2600}
  setTimeout(function(){c.remove();busy=false;stars(6)},end+50);
}
function loop(){setTimeout(function(){spawn();loop()},rnd(8000,20000))}
 function randomEffects(){
   setTimeout(function(){
     if(started&&!busy){
       var events=[
         function(){wave();stars(10)},
         function(){play(clock,"glow");stars(14)},
         function(){play(clock,"squash");coin()},
         function(){play(main,"shake");stars(18)},
         function(){rain(10)},
         function(){play(clock,"spin360");stars(12)},
         function(){scatter();stars(16)}
       ];
       events[Math.floor(Math.random()*events.length)]();
     }
     randomEffects();
   },rnd(6500,15500));

function setTarget(){var n=new Date(Date.now()+off),t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),15,0,0);if(t<=n)t=new Date(t.getTime()+864e5);TG=t.getTime()}
function frame(){

  var d=[Math.floor(h/10),h%10,Math.floor(m/10),m%10,Math.floor(s/10),s%10].map(String);

  var p=Math.min(1,Math.max(0,1-left/14400));runner.style.left=(p*100)+"%";
  if(m!==lastMin&&lastMin!==-1&&left>0){coin();wave();
    if(h!==lastHr){play(main,"shake");rain(26);stars(20)}else if(m%5===0){play(clock,"spin360");stars(24)}}
  lastMin=m;lastHr=h;
  if(left===0&&!done){done=true;banner.classList.add("show");play(main,"shake");wave();stars(40);rain(60);setTimeout(function(){stars(30)},600)}
  if(left>0&&done){done=false;banner.classList.remove("show")}
  msg.textContent=left===0?"Time’s up!":left>14400?"Counting down to 3:00 PM":Math.round(p*100)+"% of the way to the flag";
}
function start(){
  if(started)return;started=true;setTarget();$("title").classList.add("go");
  setTimeout(function(){$("title").style.display="none";$("run").classList.add("show");$("course").classList.add("show");last=null;lastMin=-1;frame();stars(30);loop();randomEffects()},800);
}
$("start").onclick=start;
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!started)start();
  if(e.key==="c"||e.key==="C")spawn();
});
var demos=[[13,59,58],[14,33,58],[14,56,58],[14,59,50]],btn=$("demo");
btn.onclick=function(){var t=demos[di],n=new Date();
  off=new Date(n.getFullYear(),n.getMonth(),n.getDate(),t[0],t[1],t[2]).getTime()-n.getTime();
  di=(di+1)%demos.length;setTarget();btn.textContent="Preview "+(di+1)+"/4";
  if(!started){start();return}
  lastMin=-1;lastHr=-1;done=false;banner.classList.remove("show");frame()};
setInterval(frame,250);
})();
